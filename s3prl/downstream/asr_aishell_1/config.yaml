runner:
  total_steps: 200000
  gradient_clipping: 1
  gradient_accumulate_steps: 1
  log_step: 100
  eval_step: 2000
  save_step: 500
  max_keep: 1
  eval_dataloaders:
    - dev

  scheduler: warmup_Liner
  warmup_proportion: 0.08   # 前 8% 步数做 warmup

optimizer:
  name: TorchOptim
  torch_optim_name: AdamW
  lr: 2.0e-4          # 最大学习率
  weight_decay: 0.01   # 正则

# comment the whole scheduler config block
# to disable learning rate scheduling
# scheduler:
#   name: linear_schedule_with_warmup
#   num_warmup_steps: 1400
# comment the whole specaug config block
# to disable specaug on representation

specaug:
  adaptive: false
  adaptive_number_ratio: 0.04
  adaptive_size_ratio: 0.04
  max_n_time_masks: 20
  apply_time_warp: true
  apply_time_mask: true
  apply_freq_mask: true
  time_warp_window: 5
  time_mask_width_range: [0, 40]
  freq_mask_width_range: [0, 50]
  num_freq_mask: 4
  num_time_mask: 2


downstream_expert:
  datarc:
    # Pre-cut AISHELL-1 wav manifests:
    # - each line contains key:value pairs: utt/feat/feat_shape/text
    # - `feat` should be an absolute path to a wav file
    # - `feat_shape` should be utterance duration in seconds
    manifest_dir: "/Work21/2026/xuzhao/s3prl/s3prl/downstream/asr_aishell_1/data"
    train: ["train.txt"]
    dev: ["dev.txt"]
    test: ["test.txt"]
    num_workers: 8
    train_batch_size: 16
    batch_size: 16
    eval_batch_size: 8
    libri_root: '/CDShare3/LibriSpeech'
    bucket_file: './data/librispeech/len_for_bucket'
    dict_path: "/Work21/2026/xuzhao/s3prl/s3prl/downstream/asr_aishell_1/data/char.dict"

    zero_infinity: True

    decoder_args:
      # See https://github.com/flashlight/text/blob/main/flashlight/lib/text/decoder/LexiconDecoder.h#L20-L30
      # for what the options mean. Python binding exposes the same options from C++.
      # KenLM is a fast LM query implementation, and it can be powered by:
      # 1. official LibriSpeech 4-gram LM: the 4-gram.arpa file on http://www.openslr.org/11
      # 2. fairseq style, letter-based lexicon: https://dl.fbaipublicfiles.com/fairseq/wav2vec/librispeech_lexicon.lst
      decoder_type: 'None'
      nbest: 1
      criterion: "ctc"
      beam: 5
      beam_threshold: 25
      kenlm_model: '/home/leo/d/datasets/4-gram.arpa'
      lexicon: '/home/leo/d/datasets/librispeech_lexicon.lst'
      lm_weight: 2
      word_score: -1
      unk_weight: -math.inf
      sil_weight: 0

  modelrc:
    project_dim: 1024
    select: RNNs
    Wav2Letter:
      total_rate: 320
    RNNs:
      total_rate: -1
      module: 'LSTM'
      bidirection: True
      dim: [1024, 1024, 1024]
      dropout: [0.2, 0.2, 0.2]
      layer_norm: [False, False, False]
      proj: [False, False, False]
      sample_rate: [1, 1, 1]
      sample_style: 'concat'

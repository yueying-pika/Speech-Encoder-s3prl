# LSTM Downstream 配置文件
# 用于 S3PRL run_downstream.py

runner:
  total_steps: 10000
  gradient_clipping: 1.0
  gradient_accumulate_steps: 1
  log_step: 100
  eval_step: 500
  save_step: 1000
  max_keep: 5

optimizer:
  name: Adam
  lr: 1.0e-4

# 数据配置
downstream_expert:
  datarc:
    data_dir: "./data"          # 数据目录，请修改为你的实际路径
    batch_size: 8
    num_workers: 4

  # 模型配置
  modelrc:
    hidden_dim: 256             # LSTM hidden dimension
    num_layers: 2               # LSTM 层数
    num_classes: 10             # 分类类别数，请根据你的任务修改
    dropout: 0.1
    bidirectional: true         # 是否使用双向 LSTM
